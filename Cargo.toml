# Cargo.toml

[package]
name = "rust-fs-mcp"
resolver = "3"
version = "0.3.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Rust stdio MCP server compatible with fs-mcp public tool contracts."
readme = "readme.md"
repository = "https://github.com/jungho-dev/rust-fs-mcp"
homepage = "https://github.com/jungho-dev/rust-fs-mcp"
documentation = "https://docs.rs/rust-fs-mcp"
keywords = ["mcp", "filesystem", "stdio", "json-rpc", "fs"]
categories = ["development-tools", "filesystem", "command-line-utilities"]
exclude = [
  "/.cmd",
  "/.docs",
  "/.github",
  "/.vscode",
  "/.gitignore-private",
  "/.gitignore-public",
  "/architecture-ko.md",
  "/readme-ko.md",
  "/scripts",
]

[dependencies]
base64 = "0.23.1"
regex = "1.13.1"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
ignore = "0.4.34"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
scraper = "0.29.0"
html2text = "0.17.4"
htmd = "0.5.6"
dom_smoothie = "0.19.0"
encoding_rs = "0.8.44"
# variable-lookbehinds 제외 (기존 오류 계약 유지)
fancy-regex = { version = "0.20.0", default-features = false, features = ["perf", "std", "unicode"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
