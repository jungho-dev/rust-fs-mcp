# Cargo.toml

[package]
name = "rust-fs-mcp"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Rust stdio MCP server compatible with fs-mcp public tool contracts."
repository = "https://github.com/jungho-dev/rust-fs-mcp"

[dependencies]
base64 = "0.22.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]

opt-level = 3    
lto = true
codegen-units = 1
strip = true
panic = "abort"