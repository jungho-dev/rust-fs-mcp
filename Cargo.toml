# Cargo.toml

[package]
name = "rust-fs-mcp"
resolver = "3"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Rust stdio MCP server compatible with fs-mcp public tool contracts."
readme = "README.md"
repository = "https://github.com/jungho-dev/rust-fs-mcp"
homepage = "https://github.com/jungho-dev/rust-fs-mcp"
documentation = "https://docs.rs/rust-fs-mcp"
keywords = ["mcp", "filesystem", "stdio", "json-rpc", "fs"]
categories = ["development-tools", "filesystem", "command-line-utilities"]
exclude = [
  "/.cmd",
  "/.docs",
  "/docs",
  "/.github",
  "/.vscode",
  "/.gitignore-private",
  "/.gitignore-public",
  "/ARCHITECTURE-KO.md",
  "/README-KO.md",
  "/scripts",
]

[dependencies]
base64 = "0.23.1"
regex = "1.13.1"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
globset = "0.4.21"
ignore = "0.4.34"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false }
encoding_rs = "0.8.44"
fancy-regex = { version = "0.20.0", default-features = false, features = ["perf", "std", "unicode"] }
similar = "3.2.1"

[target.'cfg(windows)'.dependencies]
schannel = "0.1.29"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
